<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Brewista Dial-In</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brewista">
  <meta name="theme-color" content="#120c08">
  <style>
    :root {
      --bg: #120c08;
      --card: #1c140e;
      --input: #231810;
      --accent: #d4a373;
      --accent-muted: #8c6d46;
      --border: #332317;
      --text: #f4ede4;
      --muted: #a39281;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 12, 8, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 0.6rem) 1rem 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-icon {
      font-size: 1.3rem;
      background: var(--input);
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }
    .brand-title { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .brand-sub { font-size: 0.68rem; color: var(--muted); }
    .btn-icon {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    main {
      flex: 1;
      padding: 0.85rem;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding-bottom: calc(140px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      line-height: 1.5;
      font-size: 0.88rem;
    }
    .user-bubble {
      align-self: flex-end;
      background: #2b1c12;
      border: 1px solid var(--accent-muted);
      max-width: 85%;
      border-radius: 12px;
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
    }
    .recipe-header {
      color: var(--accent);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.35rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.5rem 0;
      font-size: 0.8rem;
    }
    th, td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-size: 0.72rem; }
    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(18, 12, 8, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 0.5rem 0.85rem calc(var(--safe-bottom) + 0.6rem);
      max-width: 680px;
      margin: 0 auto;
    }
    .water-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.45rem;
    }
    .water-chip {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .water-chip.active {
      background: var(--accent);
      color: #120c08;
      border-color: var(--accent);
      font-weight: 700;
    }
    .input-box {
      display: flex;
      gap: 0.4rem;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.35rem 0.5rem;
      align-items: center;
    }
    .input-box:focus-within { border-color: var(--accent); }
    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.88rem;
      padding: 0.2rem 0.3rem;
    }
    .send-btn {
      background: var(--accent);
      border: none;
      color: #120c08;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">☕</div>
      <div>
        <div class="brand-title">Brewista Dial-In</div>
        <div class="brand-sub">K-Pro • V60 • Orea • Mugen</div>
      </div>
    </div>
    <div style="display:flex; gap:0.4rem;">
      <button class="btn-icon" id="clearBtn" title="Clear">🗑️</button>
    </div>
  </header>

  <main id="chatFeed">
    <div class="card" id="keyCard">
      <div class="recipe-header">Gemini API Setup</div>
      <p style="color:var(--muted); font-size:0.8rem; margin-bottom:0.6rem;">
        Paste your Google AI Studio API key here:
      </p>
      <div style="display:flex; gap:0.4rem;">
        <input type="password" id="inlineKeyInput" placeholder="Paste AQ... key here" style="background:#140d08; border:1px solid var(--border); padding:0.5rem; border-radius:6px; color:var(--text); font-size:0.82rem; flex:1;">
        <button id="inlineKeySave" style="background:var(--accent); border:none; color:#120c08; padding:0.5rem 0.9rem; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.82rem;">Save</button>
      </div>
      <div id="keyStatusText" style="font-size:0.75rem; color:#81c784; margin-top:0.4rem;"></div>
    </div>

    <div class="card" id="welcomeCard">
      <div class="recipe-header">Ready to Dial In</div>
      <p style="color:var(--muted); font-size:0.8rem; margin-top:0.3rem;">
        Select your water volume, type your coffee (e.g. <em>Fabrica Peru washed</em>), and tap the arrow.
      </p>
    </div>
  </main>

  <div class="composer">
    <div class="water-row">
      <span style="font-size:0.7rem; color:var(--muted); font-weight:600;">💧 Water:</span>
      <button class="water-chip" data-water="200g">200g</button>
      <button class="water-chip active" data-water="250g">250g</button>
      <button class="water-chip" data-water="300g">300g</button>
      <button class="water-chip" data-water="500g">500g</button>
    </div>
    <div class="input-box">
      <input type="text" id="coffeeInput" placeholder="Bean name, roaster, or cooling taste issue...">
      <button class="send-btn" id="sendBtn">↑</button>
    </div>
  </div>

  <script>
    var KEY_NAME = "brewista_key";
    var targetWater = "250g";
    var history = [];

    var SYSTEM_PROMPT = "You are Liz's specialty coffee dial-in companion. Liz prioritizes sweet, round, balanced cups, silky body, and transparent finish. She dislikes sharp lemon acidity, thin tea brews, astringent dryness, and over-extracted bitterness.\n\nEQUIPMENT:\n- Brewers: Orea V3 / 03, Hario Mugen, Hario V60 (ceramic/glass), Deep 27 Flower, Clever Dripper, AeroPress Flow Control, melodrip.\n- Grinder: 1Zpresso K-Pro (baseline 7.0-7.5; decafs 7.7-8.0).\n- Water: RO + Third Wave Water Medium Roast at 25-30% strength (~45-55 ppm) with optional Lotus JAMM drops.\n\nCRITICAL OUTPUT FORMAT RULE:\nGive NO conversational intro, pleasantries, or preamble. Jump directly into the Recipe:\n\n### [Roaster] - [Bean Name]\n**Target Water:** [Quantity requested] | **Coffee Dose:** [Grams for 1:15 to 1:16] | **Water Temp:** [C / F]\n\n- **Recommended Brewer:** [State exact brewer and 1 short sentence why it fits this roast/process]\n- **Grind Size:** [1Zpresso K-Pro clicks, e.g., 7.2]\n- **Water Chemistry:** RO + 25-30% TWW Medium Roast (add 1 drop JAMM if sweet finish is needed)\n\n#### Pour Schedule:\n| Step | Time | Weight | Technique |\n|---|---|---|---|\n| Bloom | 0:00 - 0:45 | [grams] | Gentle circle, low agitation |\n| Pour 1 | 0:45 - 1:20 | [grams] | Gentle center spiral |\n| Pour 2 | 1:20 - 2:30 | [total] | Low-flow pour (melodrip if available) |\n\n**Target Drawdown:** [e.g., 2:45 - 3:05]\n**Cooling Diagnostic:** [1 sentence on what to expect as it cools and when to adjust grind by 0.2 clicks]";

    var keyStatus = document.getElementById("keyStatusText");
    var keyField = document.getElementById("inlineKeyInput");
    var savedKey = (localStorage.getItem(KEY_NAME) || "").trim();

    if (savedKey) {
      keyField.value = savedKey;
      keyStatus.textContent = "✓ Key saved in device storage.";
    }

    document.getElementById("inlineKeySave").addEventListener("click", function() {
      var val = keyField.value.trim();
      if (val) {
        localStorage.setItem(KEY_NAME, val);
        keyStatus.textContent = "✓ Key saved successfully!";
        keyStatus.style.color = "#81c784";
      } else {
        keyStatus.textContent = "Please paste a valid key.";
        keyStatus.style.color = "#e57373";
      }
    });

    var chips = document.querySelectorAll(".water-chip");
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener("click", function() {
        for (var j = 0; j < chips.length; j++) {
          chips[j].classList.remove("active");
        }
        this.classList.add("active");
        targetWater = this.getAttribute("data-water");
      });
    }

    document.getElementById("clearBtn").addEventListener("click", function() {
      history = [];
      location.reload();
    });

    document.getElementById("sendBtn").addEventListener("click", submitPrompt);
    document.getElementById("coffeeInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        submitPrompt();
      }
    });

    async function submitPrompt() {
      var input = document.getElementById("coffeeInput");
      var text = input.value.trim();
      if (!text) return;

      var apiKey = (localStorage.getItem(KEY_NAME) || "").trim();
      if (!apiKey) {
        alert("Please paste and save your Gemini API key in the top box first.");
        return;
      }

      var feed = document.getElementById("chatFeed");
      var userDiv = document.createElement("div");
      userDiv.className = "user-bubble";
      userDiv.textContent = text + " (" + targetWater + ")";
      feed.appendChild(userDiv);
      input.value = "";

      var loadDiv = document.createElement("div");
      loadDiv.className = "card";
      loadDiv.style.color = "var(--accent)";
      loadDiv.textContent = "Formulating dial-in recipe card...";
      feed.appendChild(loadDiv);
      window.scrollTo(0, document.body.scrollHeight);

      var promptWithMeta = text + "\n[Target Water: " + targetWater + "]";
      history.push({ role: "user", parts: [{ text: promptWithMeta }] });

      var controller = new AbortController();
      var timeoutId = setTimeout(function() { controller.abort(); }, 20000);

      try {
        var endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(apiKey);
        
        var res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: history
          })
        });

        clearTimeout(timeoutId);
        loadDiv.remove();

        var data = await res.json();

        if (res.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          var raw = data.candidates[0].content.parts[0].text;
          history.push({ role: "model", parts: [{ text: raw }] });

          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML = parseSimpleMarkdown(raw);
          feed.appendChild(card);
        } else {
          var msg = (data.error && data.error.message) ? data.error.message : ("Status " + res.status + ": " + JSON.stringify(data));
          renderError("API Error: " + msg);
        }
      } catch (err) {
        clearTimeout(timeoutId);
        loadDiv.remove();
        if (err.name === "AbortError") {
          renderError("Request timed out after 20 seconds. Please check your internet connection.");
        } else {
          renderError("Network error: " + err.message);
        }
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function renderError(msg) {
      var feed = document.getElementById("chatFeed");
      var errDiv = document.createElement("div");
      errDiv.className = "card";
      errDiv.style.color = "#e57373";
      errDiv.textContent = msg;
      feed.appendChild(errDiv);
    }

    function parseSimpleMarkdown(md) {
      var lines = md.split("\n");
      var html = "";
      var inTable = false;

      for (var k = 0; k < lines.length; k++) {
        var line = lines[k].trim();
        if (line.indexOf("### ") === 0) {
          html += '<div class="recipe-header">' + line.substring(4) + '</div>';
        } else if (line.indexOf("#### ") === 0) {
          html += '<div style="color:var(--accent); font-weight:700; margin-top:0.6rem; font-size:0.85rem;">' + line.substring(5) + '</div>';
        } else if (line.indexOf("|") === 0) {
          if (line.indexOf("|---|") !== -1) continue;
          if (!inTable) { html += "<table>"; inTable = true; }
          var parts = line.split("|").slice(1, -1);
          html += "<tr>";
          for (var p = 0; p < parts.length; p++) {
            html += "<td>" + parts[p].trim() + "</td>";
          }
          html += "</tr>";
        } else {
          if (inTable) { html += "</table>"; inTable = false; }
          if (line.length > 0) {
            var formatted = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html += "<p style='margin-bottom:0.3rem;'>" + formatted + "</p>";
          }
        }
      }
      if (inTable) html += "</table>";
      return html;
    }
  </script>
</body>
</html>
