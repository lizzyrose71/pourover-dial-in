  <style>
    :root {
      --bg-dark: #120c08;
      --bg-card: #1c140e;
      --bg-card-hover: #261b14;
      --bg-input: #231810;
      --accent: #d4a373;
      --accent-glow: #e6b887;
      --accent-muted: #8c6d46;
      --border: #332317;
      --text-main: #f4ede4;
      --text-muted: #a39281;
      --text-dim: #716254;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 12, 8, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 0.6rem) 1rem 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-icon {
      font-size: 1.4rem;
      background: #231810;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }
    .brand-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.3px; color: var(--accent); }
    .brand-sub { font-size: 0.68rem; color: var(--text-muted); font-weight: 400; }

    .header-actions { display: flex; align-items: center; gap: 0.45rem; }
    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 2rem;
      height: 2rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-icon:hover { color: var(--text-main); border-color: var(--accent); }
    .btn-icon.active { background: var(--accent); color: #120c08; border-color: var(--accent); }
