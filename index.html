<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Brewista Dial-In</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brewista">
  <meta name="theme-color" content="#120c08">
  <style>
    :root {
      --bg: #120c08;
      --card: #1c140e;
      --input: #231810;
      --accent: #d4a373;
      --accent-muted: #8c6d46;
      --border: #332317;
      --text: #f4ede4;
      --muted: #a39281;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 12, 8, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 0.6rem) 1rem 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-icon {
      font-size: 1.3rem;
      background: var(--input);
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }
    .brand-title { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .brand-sub { font-size: 0.68rem; color: var(--muted); }
    .btn-icon {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    main {
      flex: 1;
      padding: 0.85rem;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding-bottom: calc(140px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      line-height: 1.5;
      font-size: 0.88rem;
    }
    .user-bubble {
      align-self: flex-end;
      background: #2b1c12;
      border: 1px solid var(--accent-muted);
      max-width: 85%;
      border-radius: 12px;
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
    }
    .recipe-header {
      color: var(--accent);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.35rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.5rem 0;
      font-size: 0.8rem;
    }
    th, td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-size: 0.72rem; }
    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(18, 12, 8, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 0.5rem 0.85rem calc(var(--safe-bottom) + 0.6rem);
      max-width: 680px;
      margin: 0 auto;
    }
    .water-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.45rem;
    }
    .water-chip {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .water-chip.active {
      background: var(--accent);
      color: #120c08;
      border-color: var(--accent);
      font-weight: 700;
    }
    .input-box {
      display: flex;
      gap: 0.4rem;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.35rem 0.5rem;
      align-items: center;
    }
    .input-box:focus-within { border-color: var(--accent); }
    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.88rem;
      padding: 0.2rem 0.3rem;
    }
    .send-btn {
      background: var(--accent);
      border: none;
      color: #120c08;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">☕</div>
      <div>
        <div class="brand-title">Brewista Dial-In</div>
        <div class="brand-sub">K-Pro • V60 • Orea • Mugen</div>
      </div>
    </div>
    <div style="display:flex; gap:0.4rem;">
      <button class="btn-icon" id="keyBtn" title="API Key">🔑</button>
      <button class="btn-icon" id="clearBtn" title="Clear">🗑️</button>
    </div>
  </header>

  <main id="chatFeed">
    <div class="card" id="welcomeCard">
      <div class="recipe-header">Ready to Dial In</div>
      <p style="color:var(--muted); font-size:0.8rem; margin-top:0.3rem;">
        Select your water volume, type your coffee (e.g. <em>Fabrica Peru washed</em>), and tap the arrow.
      </p>
    </div>
  </main>

  <div class="composer">
    <div class="water-row">
      <span style="font-size:0.7rem; color:var(--muted); font-weight:600;">💧 Water:</span>
      <button class="water-chip" data-water="200g">200g</button>
      <button class="water-chip active" data-water="250g">250g</button>
      <button class="water-chip" data-water="300g">300g</button>
      <button class="water-chip" data-water="500g">500g</button>
    </div>
    <div class="input-box">
      <input type="text" id="coffeeInput" placeholder="Bean name, roaster, or cooling taste issue...">
      <button class="send-btn" id="sendBtn">↑</button>
    </div>
  </div>

  <div class="modal" id="keyModal">
    <div class="modal-content">
      <h3 style="color:var(--accent); font-size:1rem;">Gemini API Key</h3>
      <p style="font-size:0.78rem; color:var(--muted);">
        Paste your Google AI Studio API key. It is saved directly in your phone:
      </p>
      <input type="password" id="keyInput" placeholder="AQ..." style="background:#140d08; border:1px solid var(--border); padding:0.6rem; border-radius:8px; color:var(--text); font-size:0.85rem; width:100%;">
      <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:0.3rem;">
        <button id="cancelKey" style="background:#221710; border:1px solid var(--border); color:var(--muted); padding:0.45rem 0.8rem; border-radius:6px; cursor:pointer;">Cancel</button>
        <button id="saveKey" style="background:var(--accent); border:none; color:#120c08; padding:0.45rem 0.8rem; border-radius:6px; font-weight:700; cursor:pointer;">Save</button>
      </div>
    </div>
  </div>

  <script>
    const KEY_NAME = "brewista_key";
    let targetWater = "250g";
    let history = [];

    const SYSTEM_PROMPT = `You are Liz's specialty coffee dial-in companion. Liz prioritizes sweet, round, balanced cups, silky body, and transparent finish. She dislikes sharp lemon acidity, thin tea brews, astringent dryness, and over-extracted bitterness.

EQUIPMENT:
- Brewers: Orea V3 / 03, Hario Mugen, Hario V60 (ceramic/glass), Deep 27 Flower, Clever Dripper, AeroPress Flow Control, melodrip.
- Grinder: 1Zpresso K-Pro (baseline 7.0-7.5; decafs 7.7-8.0).
- Water: RO + Third Wave Water Medium Roast at 25-30% strength (~45-55 ppm) with optional Lotus JAMM drops.

CRITICAL OUTPUT FORMAT RULE:
Give NO conversational intro, pleasantries, or preamble. Jump directly into the Recipe:

### [Roaster] - [Bean Name]
**Target Water:** [Quantity requested] | **Coffee Dose:** [Grams for 1:15 to 1:16] | **Water Temp:** [°C / °F]

- **Recommended Brewer:** [State exact brewer and 1 short sentence why it fits this roast/process]
- **Grind Size:** [1Zpresso K-Pro clicks, e.g., 7.2]
- **Water Chemistry:** RO + 25-30% TWW Medium Roast (add 1 drop JAMM if sweet finish is needed)

#### Pour Schedule:
| Step | Time | Weight | Technique |
|---|---|---|---|
| Bloom | 0:00 - 0:45 | [grams] | Gentle circle, low agitation |
| Pour 1 | 0:45 - 1:20 | [grams] | Gentle center spiral |
| Pour 2 | 1:20 - 2:30 | [total] | Low-flow pour (melodrip if available) |

**Target Drawdown:** [e.g., 2:45 - 3:05]
**Cooling Diagnostic:** [1 sentence on what to expect as it cools and when to adjust grind by 0.2 clicks]`;

    // Interactive Water Chips
    document.querySelectorAll(".water-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".water-chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        targetWater = chip.getAttribute("data-water");
      });
    });

    // Key Modal Handlers
    const keyModal = document.getElementById("keyModal");
    document.getElementById("keyBtn").addEventListener("click", () => {
      document.getElementById("keyInput").value = localStorage.getItem(KEY_NAME) || "";
      keyModal.style.display = "flex";
    });
    document.getElementById("cancelKey").addEventListener("click", () => keyModal.style.display = "none");
    document.getElementById("saveKey").addEventListener("click", () => {
      localStorage.setItem(KEY_NAME, document.getElementById("keyInput").value.trim());
      keyModal.style.display = "none";
    });

    // Clear Chat
    document.getElementById("clearBtn").addEventListener("click", () => {
      history = [];
      document.getElementById("chatFeed").innerHTML = `
        <div class="card">
          <div class="recipe-header">Ready to Dial In</div>
          <p style="color:var(--muted); font-size:0.8rem; margin-top:0.3rem;">
            Select your water volume, type your coffee, and hit the arrow.
          </p>
        </div>
      `;
    });

    // Submit Prompts
    document.getElementById("sendBtn").addEventListener("click", submitPrompt);
    document.getElementById("coffeeInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitPrompt();
      }
    });

    async function submitPrompt() {
      const input = document.getElementById("coffeeInput");
      const text = input.value.trim();
      if (!text) return;

      const apiKey = localStorage.getItem(KEY_NAME);
      if (!apiKey) {
        keyModal.style.display = "flex";
        return;
      }

      const feed = document.getElementById("chatFeed");
      const welcome = document.getElementById("welcomeCard");
      if (welcome) welcome.remove();

      const userDiv = document.createElement("div");
      userDiv.className = "user-bubble";
      userDiv.textContent = `${text} (${targetWater})`;
      feed.appendChild(userDiv);
      input.value = "";

      const loadDiv = document.createElement("div");
      loadDiv.className = "card";
      loadDiv.style.color = "var(--accent)";
      loadDiv.textContent = "Formulating dial-in recipe card...";
      feed.appendChild(loadDiv);
      window.scrollTo(0, document.body.scrollHeight);

      const promptWithMeta = `${text}\\n[Target Water: ${targetWater}]`;
      history.push({ role: "user", parts: [{ text: promptWithMeta }] });

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: history
          })
        });

        const data = await res.json();
        loadDiv.remove();

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          const raw = data.candidates[0].content.parts[0].text;
          history.push({ role: "model", parts: [{ text: raw }] });
          
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = parseMarkdown(raw);
          feed.appendChild(card);
        } else {
          const errDiv = document.createElement("div");
          errDiv.className = "card";
          errDiv.style.color = "#e57373";
          errDiv.textContent = "Error: " + (data.error ? (data.error.message || JSON.stringify(data.error)) : JSON.stringify(data));
          feed.appendChild(errDiv);
        }
      } catch (err) {
        loadDiv.remove();
        const errDiv = document.createElement("div");
        errDiv.className = "card";
        errDiv.style.color = "#e57373";
        errDiv.textContent = "Connection error: " + err.message;
        feed.appendChild(errDiv);
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function parseMarkdown(md) {
      return md
        .replace(/^### (.*$)/gim, '<div class="recipe-header">$1</div>')
        .replace(/^#### (.*$)/gim, '<div style="color:var(--accent); font-weight:700; margin-top:0.6rem; font-size:0.85rem;">$1</div>')
        .replace(/\\*\\*(.*?)\\*\\*/gim, '<strong>$1</strong>')
        .replace(/\\|(.+)\\|/g, function(match) {
          const cells = match.split('|').filter(c => c.trim() !== '');
          return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
        })
        .replace(/(<tr>.*<\\/tr>)/gis, '<table>$1</table>')
        .replace(/\\n/g, '<br>');
    }
  </script>
</body>
</html>
